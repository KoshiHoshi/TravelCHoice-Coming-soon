<style>
:root{
  color-scheme:light;
  --bg:#F1EFE8; --surface:#FAF9F5; --line:#DEDACF; --ink:#202322; --muted:#565E5A;
  --forest:#17352F; --gold:#B89A5A; --gold-soft:#C5AB6F; --cta:#9B7A45;
  --road:#DEDACF; --glow:rgba(184,154,90,.18);
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --script:"Dancing Script",cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#17352F; --surface:#1d3f38; --line:#2c534b; --ink:#F1EFE8; --muted:#b9c2bc;
    --road:#0f2823; --glow:rgba(197,171,111,.16); --cta:#C5AB6F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#17352F; --surface:#1d3f38; --line:#2c534b; --ink:#F1EFE8; --muted:#b9c2bc;
  --road:#0f2823; --glow:rgba(197,171,111,.16); --cta:#C5AB6F;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{
  min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.glow{
  position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(60vmax 40vmax at 85% 8%,var(--glow),transparent 60%),
    radial-gradient(50vmax 40vmax at 0% 100%,var(--glow),transparent 65%);
}
.wrap{
  position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:clamp(1.25rem,4vw,3rem) clamp(1.25rem,6vw,5rem);
}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem}

.status{
  display:inline-flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--muted);
  border:1px solid var(--line);background:var(--surface);padding:.5rem .95rem;border-radius:999px;
}
.pulse{width:.5rem;height:.5rem;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 var(--gold);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 .6rem transparent}100%{box-shadow:0 0 0 0 transparent}}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(1rem,4vh,3rem) 0 1rem;max-width:62rem}
.script{font-family:var(--script);font-size:clamp(1.5rem,3vw,2.1rem);color:var(--gold);margin-bottom:1rem}
h1{
  font-family:var(--serif);font-weight:400;letter-spacing:-.02em;line-height:1.04;
  font-size:clamp(2.4rem,6.2vw,5rem);
}
.lede{
  margin-top:1.75rem;max-width:34rem;color:var(--muted);font-size:clamp(1rem,1.5vw,1.15rem);line-height:1.7;
}
.progress{margin-top:2.5rem;max-width:26rem}
.progress p{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:.6rem}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:72%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-soft),var(--gold));background-size:200% 100%;animation:fill 1.6s cubic-bezier(.2,.7,.2,1) both,shimmer 3.2s linear 1.6s infinite}
@keyframes fill{from{width:0}}
@keyframes shimmer{to{background-position:-200% 0}}
.cta{
  align-self:flex-start;display:inline-block;margin-top:2.25rem;background:var(--cta);color:#fff;text-decoration:none;
  padding:.95rem 1.6rem;border-radius:999px;font-size:.95rem;font-weight:500;transition:transform .2s,background .2s;
}
.cta:hover{transform:translateY(-2px);background:#855F2E}
.cta:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.road{--car-w:clamp(76px,9vw,124px);--car-h:calc(var(--car-w) * 0.4615);position:relative;margin:0 calc(-1 * clamp(1.25rem,6vw,5rem));height:clamp(140px,27vh,270px)}
.road svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.edge{fill:none;stroke:var(--road);stroke-width:calc(var(--car-h) + 22px);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.lane{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:3 14;stroke-linecap:round;opacity:.9;vector-effect:non-scaling-stroke}
@keyframes reveal{to{clip-path:inset(-120px 0 -120px 0)}}
.car{position:absolute;left:0;top:0;width:var(--car-w);height:var(--car-h);margin:calc(var(--car-h) / -2) 0 0 calc(var(--car-w) / -2);opacity:0;pointer-events:none;will-change:transform;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
footer{
  display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  padding-top:1.25rem;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);
}
footer a{color:inherit;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;transition:color .2s}
footer a:hover{color:var(--gold)}
footer a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
@media (max-width:560px){.status{font-size:.78rem}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
</style>

<script>
(function(){
  var svg=document.getElementById('roadsvg'),p=document.getElementById('roadpath'),car=document.getElementById('car');
  var VW=1200,VH=260,L=p.getTotalLength(),DUR=9000,DELAY=0,PAUSE=0;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function place(t){
    var r=svg.getBoundingClientRect(),sx=r.width/VW,sy=r.height/VH,d=t*L;
    var a=p.getPointAtLength(d),b=p.getPointAtLength(Math.min(d+2,L)),c=p.getPointAtLength(Math.max(d-2,0));
    var ang=Math.atan2((b.y-c.y)*sy,(b.x-c.x)*sx);
    car.style.transform='translate('+(a.x*sx)+'px,'+(a.y*sy)+'px) rotate('+ang+'rad)';
  }
  if(reduce){place(.45);car.style.opacity=1;addEventListener('resize',function(){place(.45)});return;}
  var start=null;place(.11);car.style.opacity=1;
  function frame(now){
    if(start===null)start=now-DUR*.22;
    var e=now-start-DELAY;
    if(e<0){car.style.opacity=0}
    else{
      var m=e%(DUR+PAUSE);
      if(m>DUR){car.style.opacity=0}
      else{var u=m/DUR;place(0.5-0.5*Math.cos(Math.PI*u));car.style.opacity=1}
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
